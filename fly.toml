app = "air-pg-server"
primary_region = "iad"

[build]
  image = "ghcr.io/mahadi-rsio/air:v2.0.12"

[env]
  AIR_DATA_DIR = "/var/lib/air"
  AIR_PG_BIN_DIR = "/usr/lib/postgresql/17/bin"
  AIR_HTTP_ADDR = "0.0.0.0:8080"
  AIR_GATEWAY_ADDR = "0.0.0.0:5432"
  AIR_POOL_MODE = "true"
  AIR_IDLE_TIMEOUT = "2m"
  AIR_BOOTSTRAP_ACCOUNT_ID = "acct_default"
  AIR_R2_ENDPOINT = "https://dcd4d8a920e7d7f054ba6565cd8db426.r2.cloudflarestorage.com"
  AIR_R2_BUCKET = "air-pg-backups"
  AIR_R2_REGION = "auto"
  AIR_R2_PRIMARY = "true"
  AIR_PAGESERVER_ENABLED = "true"

[mounts]
  source = "air_data"
  destination = "/var/lib/air"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5432

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "512mb"
