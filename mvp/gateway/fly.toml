app = "air-mvp-gateway"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CELL_URL = "http://air-mvp-cell.flycast"
  CELL_APP = "air-mvp-cell"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
