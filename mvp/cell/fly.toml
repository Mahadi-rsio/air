app = "air-mvp-cell"
primary_region = "sin"

kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VOL_DIR = "/vol"
  R2_BUCKET = "air-mvp-test"

[[mounts]]
  source = "air_cell_vol"
  destination = "/vol"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

swap_size_mb = 512
