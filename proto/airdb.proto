syntax = "proto3";

package air.db.v1;

option go_package = "github.com/Mahadi-rsio/air/internal/pb;pb";

service AirDBControl {
  rpc GetTenantRoute(TenantRequest) returns (TenantRouteResponse);
  rpc WakeTenant(TenantRequest) returns (TenantRouteResponse);
  rpc TouchActivity(TenantRequest) returns (Empty);
  rpc BatchTouchActivity(BatchTouchActivityRequest) returns (Empty);
  rpc WatchTenantChanges(WatchTenantsRequest) returns (stream TenantChangeEvent);

  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  rpc GetDatabase(TenantRequest) returns (DatabaseInfo);
  rpc DeleteDatabase(TenantRequest) returns (StatusResponse);
  rpc SuspendDatabase(TenantRequest) returns (StatusResponse);
  rpc StartDatabase(TenantRequest) returns (TenantRouteResponse);
  rpc LockDatabase(TenantRequest) returns (StatusResponse);
  rpc UnlockDatabase(TenantRequest) returns (StatusResponse);

  rpc TriggerBackup(TriggerBackupRequest) returns (JsonResponse);
  rpc ListBackups(TenantRequest) returns (JsonResponse);
  rpc VerifyBackup(VerifyBackupRequest) returns (JsonResponse);
  rpc RestoreDatabase(RestoreDatabaseRequest) returns (JsonResponse);
  rpc GetOffloadStatus(TenantRequest) returns (JsonResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (StatusResponse);
}

message Empty {}

message TenantRequest {
  string tenant_id = 1;
}

message TenantRouteResponse {
  string tenant_id = 1;
  string state = 2;
  string host = 3;
  int32 port = 4;
  string sock_dir = 5;
  string app_password = 6;
}

message CreateDatabaseRequest {
  string tenant_id = 1;
  string account_id = 2;
  string idempotency_key = 3;
}

message CreateDatabaseResponse {
  string tenant_id = 1;
  string state = 2;
  int32 direct_port = 3;
  string host = 4;
  string user = 5;
  string password = 6;
  string dsn = 7;
}

message DatabaseInfo {
  string account_id = 1;
  string tenant_id = 2;
  int32 direct_port = 3;
  string system_identifier = 4;
  int64 fencing_epoch = 5;
  string state = 6;
}

message ListDatabasesRequest {
  string account_id = 1;
}

message ListDatabasesResponse {
  repeated DatabaseInfo databases = 1;
  int64 snapshot_version = 2;
}

message StatusResponse {
  string status = 1;
  string tenant_id = 2;
}

message JsonResponse {
  string json = 1;
}

message TriggerBackupRequest {
  string tenant_id = 1;
  string type = 2;
}

message VerifyBackupRequest {
  string tenant_id = 1;
  string backup_id = 2;
  bool stream_hash = 3;
  bool deep_restore = 4;
}

message RestoreDatabaseRequest {
  string tenant_id = 1;
  string backup_id = 2;
  string target_lsn = 3;
  string target_time = 4;
  string new_tenant_id = 5;
  string verify_query = 6;
}

message RevokeAPIKeyRequest {
  string key_id = 1;
}

enum TenantEventType {
  TENANT_EVENT_UNSPECIFIED = 0;
  TENANT_EVENT_UPSERT = 1;
  TENANT_EVENT_DELETE = 2;
  TENANT_EVENT_RESYNC_REQUIRED = 3;
}

message WatchTenantsRequest {
  int64 after_version = 1;
}

message TenantChangeEvent {
  int64 version = 1;
  TenantEventType type = 2;
  TenantRouteResponse route = 3;
  int64 fencing_epoch = 4;
  int64 emitted_at_unix_ms = 5;
}

message BatchTouchActivityRequest {
  repeated string tenant_ids = 1;
}

service GatewayAdmin {
  rpc DrainTenant(DrainTenantRequest) returns (StatusResponse);
  rpc SetTenantLimits(SetTenantLimitsRequest) returns (StatusResponse);
  rpc RegisterNamespace(RegisterNamespaceRequest) returns (NamespaceStatusResponse);
  rpc DeleteNamespace(TenantRequest) returns (StatusResponse);
  rpc GetNamespace(TenantRequest) returns (NamespaceInfoResponse);
}

message DrainTenantRequest {
  string tenant_id = 1;
  int32 timeout_ms = 2;
}

message SetTenantLimitsRequest {
  string tenant_id = 1;
  int32 max_client_conns = 2;
  int32 max_backends = 3;
}

message RegisterNamespaceRequest {
  string tenant_id = 1;
  string state = 2;
  string host = 3;
  int32 port = 4;
  string sock_dir = 5;
  string app_password = 6;
  string read_engine_host = 7;
  int32 read_engine_port = 8;
  string pageserver_generation = 9;
}

message NamespaceStatusResponse {
  string status = 1;
  string tenant_id = 2;
  bool air_connected = 3;
  bool read_engine_connected = 4;
  bool pageserver_connected = 5;
}

message NamespaceInfoResponse {
  string tenant_id = 1;
  string state = 2;
  string air_host = 3;
  int32 air_port = 4;
  string read_engine_host = 5;
  int32 read_engine_port = 6;
  bool pageserver_exists = 7;
  string pageserver_generation = 8;
  uint64 pageserver_last_lsn = 9;
}
