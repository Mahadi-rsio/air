app = "air-pg-gateway"
primary_region = "sin"

[build]
  dockerfile = "../../gateway/Dockerfile"

[env]
  AIR_GATEWAY_ADDR = "[::]:5432"
  AIR_GATEWAY_ADMIN_ADDR = "[::]:8081"
  AIR_DB_GRPC_ADDR = "air-pg-server.internal:9090"
  AIR_PAGESERVER_GRPC_ADDR = "air-pg-pageserver.internal:9091"
  AIR_READ_ENGINE_HOST = "air-pg-read-engine.internal"
  AIR_READ_ENGINE_PORT = "5433"
  AIR_READ_ENGINE_GRPC_ADDR = "air-pg-read-engine.internal:9092"
  AIR_BACKEND_HOST = "air-pg-server.internal"
  AIR_POOL_MODE = "true"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 5432

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
