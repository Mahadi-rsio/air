app = "air-pg-gateway"
primary_region = "sin"

[build]
  dockerfile = "../../gateway/Dockerfile"

[env]
  AIR_MESH_TLS_CA = "/run/air-tls/ca.crt"
  AIR_MESH_TLS_CERT = "/run/air-tls/tls.crt"
  AIR_MESH_TLS_KEY = "/run/air-tls/tls.key"
  AIR_TLS_CERT = "/run/air-tls/public.crt"
  AIR_TLS_KEY = "/run/air-tls/public.key"
  AIR_GATEWAY_ADDR = "[::]:5432"
  AIR_GATEWAY_ADMIN_ADDR = "127.0.0.1:8081"
  AIR_GATEWAY_ADMIN_GRPC_ADDR = "[::]:9093"
  AIR_DB_GRPC_ADDR = "air-pg-server.internal:9090"
  AIR_PAGESERVER_GRPC_ADDR = "air-pg-pageserver.internal:9091"
  AIR_READ_ENGINE_HOST = "air-pg-read-engine.internal"
  AIR_READ_ENGINE_PORT = "5433"
  AIR_READ_ENGINE_GRPC_ADDR = "air-pg-read-engine.internal:9092"
  AIR_BACKEND_HOST = "air-pg-server.internal"
  AIR_POOL_MODE = "true"
  AIR_REQUIRE_TLS = "true"
  AIR_POOL_MAX_BACKENDS = "8"
  AIR_MAX_AGGREGATE_BACKENDS = "12"
  AIR_BILLING_ENABLED = "true"
  AIR_METERING_LOG_DIR = "/var/lib/air-gateway/metering"
  AIR_METERING_MAX_SPOOL_BYTES = "268435456"
  AIR_GATEWAY_DISCOVERY_HOST = "air-pg-gateway.internal"
  AIR_GATEWAY_PEER_ADMIN_PORT = "9093"
  AIR_GATEWAY_PRIVATE_HTTP_ADDR = "[::]:8082"
  AIR_WRITE_BUFFER_GLOBAL_MAX = "16777216"
  AIR_WRITE_QUEUE_MAX_BYTES = "16777216"
  AIR_WRITE_BUFFER_SESSION_MAX = "2097152"
  GOMEMLIMIT = "180MiB"

[mounts]
  source = "air_gateway_metering"
  destination = "/var/lib/air-gateway"
  initial_size = "1gb"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

  [[services.ports]]
    port = 5432

[[files]]
  guest_path = "/run/air-tls/ca.crt"
  secret_name = "AIR_MESH_CA_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.crt"
  secret_name = "AIR_MESH_CERT_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.key"
  secret_name = "AIR_MESH_KEY_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/public.crt"
  secret_name = "AIR_GATEWAY_CERT_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/public.key"
  secret_name = "AIR_GATEWAY_KEY_PEM_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "256mb"
