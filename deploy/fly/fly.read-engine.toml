app = "air-pg-read-engine"
primary_region = "sin"

[build]
  dockerfile = "../../Dockerfile.read-engine"

[env]
  AIR_MESH_TLS_CA = "/run/air-tls/ca.crt"
  AIR_MESH_TLS_CERT = "/run/air-tls/tls.crt"
  AIR_MESH_TLS_KEY = "/run/air-tls/tls.key"
  AIR_READ_ENGINE_DATA_DIR = "/var/lib/air-read-engine"
  AIR_READ_ENGINE_CACHE_DIR = "/var/lib/air-read-engine/cache"
  AIR_READ_ENGINE_LISTEN_HOST = "[::]"
  AIR_READ_ENGINE_PG_PORT = "5433"
  AIR_READ_ENGINE_GRPC_ADDR = "[::]:9092"
  AIR_READ_ENGINE_DEBUG = "false"
  AIR_READ_ENGINE_MEMORY_MB = "256"
  AIR_READ_ENGINE_SHARED_BUFFERS = "16MB"
  AIR_PAGESERVER_GRPC_ADDR = "air-pg-pageserver.internal:9091"
  GOMEMLIMIT = "140MiB"

[mounts]
  source = "air_read_engine_data"
  destination = "/var/lib/air-read-engine"
  initial_size = "1gb"

[[files]]
  guest_path = "/run/air-tls/ca.crt"
  secret_name = "AIR_MESH_CA_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.crt"
  secret_name = "AIR_MESH_CERT_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.key"
  secret_name = "AIR_MESH_KEY_PEM_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "256mb"
