app = "air-pg-pageserver"
primary_region = "sin"

[build]
  dockerfile = "../../Dockerfile.pageserver"

[env]
  AIR_MESH_TLS_CA = "/run/air-tls/ca.crt"
  AIR_MESH_TLS_CERT = "/run/air-tls/tls.crt"
  AIR_MESH_TLS_KEY = "/run/air-tls/tls.key"
  AIR_DATA_DIR = "/var/lib/air-pageserver"
  AIR_PAGESERVER_GRPC_ADDR = "[::]:9091"
  AIR_PAGESERVER_CACHE_MB = "64"
  AIR_PAGESERVER_MEMORY_MB = "256"
  AIR_PAGESERVER_DEBUG = "false"
  AIR_R2_BUCKET = "air-pg-backups"
  AIR_R2_REGION = "auto"
  GOMEMLIMIT = "160MiB"

[mounts]
  source = "air_pageserver_data"
  destination = "/var/lib/air-pageserver"
  initial_size = "1gb"

[[files]]
  guest_path = "/run/air-tls/ca.crt"
  secret_name = "AIR_MESH_CA_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.crt"
  secret_name = "AIR_MESH_CERT_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.key"
  secret_name = "AIR_MESH_KEY_PEM_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "512mb"
