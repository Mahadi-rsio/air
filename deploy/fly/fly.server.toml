app = "air-pg-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.server-fly"

[env]
  AIR_MESH_TLS_CA = "/run/air-tls/ca.crt"
  AIR_MESH_TLS_CERT = "/run/air-tls/tls.crt"
  AIR_MESH_TLS_KEY = "/run/air-tls/tls.key"
  AIR_DATA_DIR = "/var/lib/air"
  AIR_PG_BIN_DIR = "/usr/lib/postgresql/17/bin"
  AIR_GRPC_ADDR = "[::]:9090"
  AIR_GATEWAY_ADMIN_GRPC_ADDR = "air-pg-gateway.internal:9093"
  AIR_PG_LISTEN_ADDRESSES = "*"
  AIR_BACKEND_HOST = "air-pg-server.internal"
  AIR_PAGESERVER_ENABLED = "true"
  AIR_PAGESERVER_SOCKET = "/var/lib/air/pageserver.sock"
  AIR_PAGESERVER_CACHE_MB = "64"
  AIR_PAGESERVER_GRPC_ADDR = "air-pg-pageserver.internal:9091"
  AIR_READ_ENGINE_GRPC_ADDR = "air-pg-read-engine.internal:9092"
  AIR_BOOTSTRAP_ACCOUNT_ID = "acct_default"
  AIR_IDLE_TIMEOUT = "30s"
  AIR_EVICT_ON_SUSPEND = "true"
  AIR_R2_BUCKET = "air-pg-backups"
  AIR_R2_REGION = "auto"
  AIR_POOL_MAX_BACKENDS = "8"
  GOMEMLIMIT = "160MiB"

[mounts]
  source = "air_server_data"
  destination = "/var/lib/air"
  initial_size = "2gb"

[[files]]
  guest_path = "/run/air-tls/ca.crt"
  secret_name = "AIR_MESH_CA_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.crt"
  secret_name = "AIR_MESH_CERT_PEM_B64"

[[files]]
  guest_path = "/run/air-tls/tls.key"
  secret_name = "AIR_MESH_KEY_PEM_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "512mb"
