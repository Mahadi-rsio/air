services:
  air-meta-postgres:
    image: postgres:17-alpine
    container_name: air-meta-postgres
    environment:
      POSTGRES_USER: ${AIR_META_PG_USER:-air_meta}
      POSTGRES_PASSWORD: ${AIR_META_PG_PASSWORD:-air_meta_pass}
      POSTGRES_DB: ${AIR_META_PG_DB:-air_meta}
    ports:
      - "${AIR_META_PG_PORT:-5435}:5432"
    volumes:
      - air_meta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIR_META_PG_USER:-air_meta} -d ${AIR_META_PG_DB:-air_meta}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - air-net

  air-pageserver:
    build:
      context: .
      dockerfile: Dockerfile.pageserver
    container_name: air-pageserver
    environment:
      AIR_DATA_DIR: /var/lib/air-pageserver
      AIR_PAGESERVER_GRPC_ADDR: 0.0.0.0:9091
      AIR_PAGESERVER_HTTP_ADDR: 0.0.0.0:8083
      AIR_PAGESERVER_CACHE_MB: ${AIR_PAGESERVER_CACHE_MB:-256}
      AIR_PAGESERVER_DEBUG: ${AIR_PAGESERVER_DEBUG:-true}
      AIR_INTERNAL_TOKEN: ${AIR_INTERNAL_TOKEN:-air-dev-internal-token}
      AIR_MASTER_KEY_HEX: ${AIR_MASTER_KEY_HEX:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
      AIR_R2_ENDPOINT: ${AIR_R2_ENDPOINT:-}
      AIR_R2_BUCKET: ${AIR_R2_BUCKET:-}
      AIR_R2_ACCESS_KEY_ID: ${AIR_R2_ACCESS_KEY_ID:-}
      AIR_R2_SECRET_ACCESS_KEY: ${AIR_R2_SECRET_ACCESS_KEY:-}
      AIR_R2_REGION: ${AIR_R2_REGION:-auto}
    ports:
      - "${AIR_PAGESERVER_GRPC_PORT:-9091}:9091"
      - "${AIR_PAGESERVER_HTTP_PORT:-8083}:8083"
    volumes:
      - air_pageserver_data:/var/lib/air-pageserver
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - air-net

  air-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-server
    depends_on:
      air-meta-postgres:
        condition: service_healthy
      air-pageserver:
        condition: service_healthy
    environment:
      AIR_DATA_DIR: /var/lib/air
      AIR_META_DSN: ${AIR_META_DSN:-postgres://air_meta:air_meta_pass@air-meta-postgres:5432/air_meta?sslmode=disable}
      AIR_PG_BIN_DIR: /usr/lib/postgresql/17/bin
      AIR_HTTP_ADDR: 0.0.0.0:8080
      AIR_GRPC_ADDR: 0.0.0.0:9090
      AIR_PAGESERVER_ENABLED: ${AIR_PAGESERVER_ENABLED:-true}
      AIR_PAGESERVER_SOCKET: /var/lib/air/pageserver.sock
      AIR_PAGESERVER_CACHE_MB: ${AIR_PAGESERVER_CACHE_MB:-128}
      AIR_PAGESERVER_GRPC_ADDR: air-pageserver:9091
      AIR_READ_ENGINE_GRPC_ADDR: air-read-engine:9092
      AIR_GATEWAY_ADMIN_GRPC_ADDR: air-gateway:9093
      AIR_BACKEND_HOST: air-server
      AIR_PG_LISTEN_ADDRESSES: "*"
      AIR_INTERNAL_TOKEN: ${AIR_INTERNAL_TOKEN:-air-dev-internal-token}
      AIR_MASTER_KEY_HEX: ${AIR_MASTER_KEY_HEX:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
      AIR_BOOTSTRAP_API_KEY: ${AIR_BOOTSTRAP_API_KEY:-air_dev_bootstrap_key}
      AIR_BOOTSTRAP_ACCOUNT_ID: ${AIR_BOOTSTRAP_ACCOUNT_ID:-acct_default}
      AIR_R2_ENDPOINT: ${AIR_R2_ENDPOINT:-}
      AIR_R2_BUCKET: ${AIR_R2_BUCKET:-}
      AIR_R2_ACCESS_KEY_ID: ${AIR_R2_ACCESS_KEY_ID:-}
      AIR_R2_SECRET_ACCESS_KEY: ${AIR_R2_SECRET_ACCESS_KEY:-}
      AIR_R2_REGION: ${AIR_R2_REGION:-auto}
      AIR_IDLE_TIMEOUT: ${AIR_IDLE_TIMEOUT:-}
      AIR_EVICT_ON_SUSPEND: ${AIR_EVICT_ON_SUSPEND:-false}
    ports:
      - "${AIR_HTTP_PORT:-8080}:8080"
      - "${AIR_GRPC_PORT:-9090}:9090"
    volumes:
      - air_server_data:/var/lib/air
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - air-net

  air-read-engine:
    build:
      context: .
      dockerfile: Dockerfile.read-engine
    container_name: air-read-engine
    depends_on:
      air-pageserver:
        condition: service_healthy
    environment:
      AIR_READ_ENGINE_DATA_DIR: /var/lib/air-read-engine
      AIR_READ_ENGINE_CACHE_DIR: /var/lib/air-read-engine/cache
      AIR_READ_ENGINE_LISTEN_HOST: 0.0.0.0
      AIR_READ_ENGINE_PG_PORT: 5433
      AIR_READ_ENGINE_HTTP_ADDR: 0.0.0.0:8082
      AIR_READ_ENGINE_GRPC_ADDR: 0.0.0.0:9092
      AIR_READ_ENGINE_DEBUG: ${AIR_READ_ENGINE_DEBUG:-true}
      AIR_PAGESERVER_GRPC_ADDR: air-pageserver:9091
      AIR_INTERNAL_TOKEN: ${AIR_INTERNAL_TOKEN:-air-dev-internal-token}
    ports:
      - "${AIR_READ_ENGINE_PG_PORT:-5433}:5433"
      - "${AIR_READ_ENGINE_HTTP_PORT:-8082}:8082"
      - "${AIR_READ_ENGINE_GRPC_PORT:-9092}:9092"
    volumes:
      - air_read_engine_data:/var/lib/air-read-engine
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - air-net

  air-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: air-gateway
    depends_on:
      air-server:
        condition: service_healthy
      air-read-engine:
        condition: service_healthy
    environment:
      AIR_GATEWAY_ADDR: 0.0.0.0:5432
      AIR_GATEWAY_ADMIN_ADDR: 0.0.0.0:8081
      AIR_GATEWAY_ADMIN_GRPC_ADDR: 0.0.0.0:9093
      AIR_CONTROL_PLANE_URL: http://air-server:8080
      AIR_META_DSN: ${AIR_META_DSN:-postgres://air_meta:air_meta_pass@air-meta-postgres:5432/air_meta?sslmode=disable}
      AIR_DB_GRPC_ADDR: air-server:9090
      AIR_PAGESERVER_GRPC_ADDR: air-pageserver:9091
      AIR_READ_ENGINE_HOST: air-read-engine
      AIR_READ_ENGINE_PORT: 5433
      AIR_READ_ENGINE_GRPC_ADDR: air-read-engine:9092
      AIR_BACKEND_HOST: air-server
      AIR_INTERNAL_TOKEN: ${AIR_INTERNAL_TOKEN:-air-dev-internal-token}
      AIR_POOL_MODE: "true"
    ports:
      - "${AIR_GATEWAY_PORT:-5432}:5432"
      - "${AIR_GATEWAY_ADMIN_PORT:-8081}:8081"
      - "${AIR_GATEWAY_ADMIN_GRPC_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - air-net

volumes:
  air_meta_pg_data:
  air_pageserver_data:
  air_server_data:
  air_read_engine_data:

networks:
  air-net:
    driver: bridge
