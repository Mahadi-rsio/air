name: Build and Push air-autoscaler to GHCR

on:
  push:
    tags:
      - "autoscaler-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag when triggered manually (defaults to latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: autoscaler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-autoscaler:
    name: Test Go (air-autoscaler)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test air-autoscaler
        run: |
          go build -v ./cmd/air-autoscaler
          go test -v -race ./internal/autoscaler/...

  build-air-autoscaler:
    name: Build & Push air-autoscaler Image
    needs: [test-autoscaler]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-autoscaler' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Autoscaler Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=match,pattern=^autoscaler-(v.*)$
            type=match,pattern=^autoscaler-v(.*)$
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push air-autoscaler Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.autoscaler
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=air-autoscaler
          cache-to: type=gha,mode=max,scope=air-autoscaler
