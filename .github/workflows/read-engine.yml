name: Build and Push air-read-engine to GHCR

on:
  push:
    tags:
      - "read-engine-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag when triggered manually (defaults to latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: read-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-read-engine:
    name: Test Go (air-read-engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cgo SQLite dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test air-read-engine
        run: |
          go build -v ./cmd/air-read-engine
          go test -v -short -race ./internal/readadapter/... ./cmd/air-read-engine/...

  build-air-read-engine:
    name: Build & Push air-read-engine Image
    needs: [test-read-engine]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-read-engine' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Read Engine Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=match,pattern=^read-engine-(v.*)$
            type=match,pattern=^read-engine-v(.*)$
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push air-read-engine Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.read-engine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=air-read-engine
          cache-to: type=gha,mode=max,scope=air-read-engine
