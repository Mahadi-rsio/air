name: Build and Push AIR & Gateway to GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag when triggered manually (defaults to latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test-go:
    name: Test Go (air-server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test air-server
        run: |
          go build -v ./cmd/air-server
          go test -v -race ./internal/...

  test-gateway:
    name: Test C++ (air-gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test air-gateway
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libpq-dev libssl-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
          protoc -Iproto --cpp_out=gateway/src/pb --grpc_out=gateway/src/pb \
            --plugin=protoc-gen-grpc=/usr/bin/grpc_cpp_plugin proto/airdb.proto
          make -C gateway -j"$(nproc)" all test

  build-air-server:
    name: Build & Push air-server Image
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=pageserver
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push air-server Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=air-server
          cache-to: type=gha,mode=max,scope=air-server

  build-air-gateway:
    name: Build & Push air-gateway Image
    needs: [test-gateway]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gateway' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Gateway Docker metadata (tags & labels)
        id: gw_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push air-gateway Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: ${{ steps.gw_meta.outputs.tags }}
          labels: ${{ steps.gw_meta.outputs.labels }}
          cache-from: type=gha,scope=air-gateway
          cache-to: type=gha,mode=max,scope=air-gateway
